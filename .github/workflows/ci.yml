name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual runs from the Actions tab ("Run workflow"), same as nightly.yml.
  workflow_dispatch:

concurrency:
  # Pull requests: one run per branch, newest wins — a run against a head
  # that has been superseded is answering a question nobody is asking any
  # more.
  #
  # Pushes: one run per commit, and nothing cancels anything. A commit with
  # no verdict is a hole nobody comes back to fill: the next commit contains
  # it, so the code does get tested eventually, but once that run is red
  # there is no longer any way to say which of the two commits did it.
  #
  # Keying the group on the SHA, rather than only turning cancel-in-progress
  # off, is what makes that hold for more than two pushes: a group keeps at
  # most one run *pending*, so a third push discards the second before it
  # ever starts.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conformance:
    # The state this repository actually pins: the three submodule commits
    # recorded here — the verdict a clone of this repository reproduces.
    # nightly.yml runs the same suite against the latest upstream masters.
    #
    # The same two-leg matrix as the Styx and Hermod gates: windows-latest,
    # where the suite was developed, and Debian 13 — where this code runs in
    # production. GitHub offers no Debian runner image, so the Linux leg runs
    # in a bare debian:13 container on an Ubuntu runner, the same container
    # both sibling gates use.
    #
    # fail-fast is off on purpose: "red on exactly one platform" is the most
    # valuable signal this matrix produces, so one leg must not cancel the
    # other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            leg: windows-latest
          - os: ubuntu-latest
            container: debian:13
            leg: debian-13-container
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:

      # The bare debian:13 container needs git BEFORE the checkout even runs:
      # actions/checkout falls back to the REST API where git is missing, and
      # that fallback cannot fetch submodules — which here is everything, the
      # specification, both implementations and the test vectors. The rest are
      # the .NET prerequisites, the same list as Styx and Hermod: curl for the
      # dotnet-install script, ICU and tzdata for globalization, OpenSSL for
      # crypto, ca-certificates for NuGet and npm over HTTPS. Package names
      # verified on Debian 13 (trixie).
      - name: Install prerequisites (Debian container)
        if: runner.os == 'Linux'
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git libicu76 libssl3t64 libstdc++6 tzdata

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # The TypeScript runner needs tsx (the library itself has no runtime
      # dependencies and is imported from source). Installed explicitly from
      # the lockfile rather than by the driver's fallback `npm install`, so
      # that CI is deterministic.
      - name: Install the TypeScript runner's toolchain
        working-directory: runners/typescript
        run: npm ci

      - name: Run the conformance suite
        timeout-minutes: 30
        run: node compare/run.mjs

      # The verdict table and — on a red run — the normative failures, on the
      # Actions front page, so that "which implementation failed which vector"
      # does not take downloading an artifact. The full report, the survey
      # observations and the divergence list stay in results/. A run that died
      # before the driver wrote a report has nothing to publish, and saying so
      # must not turn into a second failure next to the real one.
      - name: Publish the summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ -f results/report.md ]; then
            awk '/^## Cross-implementation divergences/{exit} {print}' results/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The suite did not get as far as writing a report.' >> "$GITHUB_STEP_SUMMARY"
          fi

      # The report is what a red run is about: which implementation failed
      # which vector, what both sides actually produced, and the raw
      # recordings to re-judge with --skip-run. It survives the run:
      # `gh run download` gets it where the log view needs a signed-in
      # browser session.
      #
      # !cancelled() rather than success(): a red run is when these files
      # matter most, and the driver writes results/ before it exits non-zero.
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.leg }}
          path: results/
