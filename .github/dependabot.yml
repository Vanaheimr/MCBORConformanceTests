version: 2

updates:

  # The TypeScript runner's `tsx`, and nothing else — not for want of other
  # npm projects, but because this is the only one CI installs. The root
  # `package.json` declares no dependencies at all, the four libraries under
  # `libs/` are submodules that carry their own Dependabot, and the two
  # generators under `tools/` are left out for the reason at the bottom of
  # this file.
  #
  # CI installs with `npm ci` (ci.yml, nightly.yml), so the lock file is what
  # is actually run and a lock file left behind its own range is invisible
  # until something reads it. That is not hypothetical: on 2026-11-01 `tsx`
  # sat at 4.23.12 while 4.23.15 was out and `^4.20.3` had always allowed it.
  # This block exists so that nobody has to notice that by hand again.
  #
  # No group: one dependency makes a group a heading over a single line.
  - package-ecosystem: npm
    directory: /runners/typescript
    schedule:
      interval: weekly
    # A release inside the range updates the lock file; the range itself
    # moves only for a release outside it.
    versioning-strategy: increase-if-necessary

  # checkout, setup-node, setup-dotnet, upload-artifact — the four this
  # repository uses, in one pull request rather than four.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'

  # Two ecosystems and two directories are deliberately absent, and all four
  # are worth saying out loud, because their absence looks like an oversight:
  #
  # **nuget.** `runners/csharp/ConformanceRunner` and `tools/CertificateCorpus`
  # declare no PackageReference whatsoever — one ProjectReference each, onto
  # `libs/Styx`. There is nothing for Dependabot to update, and whatever Styx
  # itself depends on is Styx's to track.
  #
  # **gitsubmodule.** The four pins under `libs/` are set by hand on purpose:
  # every "Advance the pin" commit carries the gate results it rests on —
  # the suite, both library gates, the conformance counts — and an automated
  # bump would carry none of that. The drift it would guard against is
  # already guarded: `nightly.yml` advances all four submodules to their
  # current `master` and runs the whole suite every night, which is the same
  # check without a pull request per upstream commit in four repositories.
  #
  # **`tools/EcdhCases` and `tools/X509Cases`.** Two npm projects with
  # committed lock files and `@noble` dependencies, and the one place in this
  # repository where leaving a directory out needs an argument rather than an
  # observation. They mint `vectors/cose-ecdh.json` — the ECDH-ES cases, the
  # two zero-leading-secret key pairs and the three attack points both
  # implementations must refuse — and `vectors/cose-x509-messages.json`, the
  # signed messages carrying a thumbprint labelled with an algorithm that is
  # not a hash algorithm. Both files are committed and are what every run
  # reads. Nothing in CI installs or executes either generator, so a bump here
  # would move a lock file no gate reads: the pull request could be neither
  # confirmed nor refuted by anything this repository runs, which is the worst
  # kind of green. The check that a changed primitive would trip sits inside
  # each generator instead — one refuses to write unless it first reproduces
  # the COSE working group's `p256-hkdf-256-01` byte for byte, the other
  # unless its control message comes out as the bytes both implementations
  # produce for `cose-x509:thumbprint-names-the-certificate` — and it fires at
  # the only moment the answer matters, which is when somebody regenerates.
  # The day CI regenerates the vectors and diffs them, which
  # `tools/CertificateCorpus` would need just as much, a block here starts
  # earning its keep. Not before.
